# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # keep the recommended set from flutter_lints and adjust below.

    # --- Intentionally disabled (documented, not accidental) -------------------
    #
    # The data layer mirrors the Supabase/Postgres column names verbatim
    # (`rest_uid`, `dish_id`, `created_at`, `dish_imageurl`, ...). Keeping the
    # Dart fields identical to the columns means `fromjson`/`tojson` stay 1:1 and
    # a query can never silently drift from its model. Renaming ~45 of these to
    # lowerCamelCase is a wide refactor that is only safe with integration tests
    # around the cart/orders round-trip, so the rule stays off until then.
    non_constant_identifier_names: false

    # Files follow the project's existing convention: PascalCase for
    # screens/widgets/classes, camelCase for helpers, repos and models. Renaming
    # 50+ files would also rewrite every `package:spicy_eats/...` import,
    # including the URL-encoded `features/dish%20menu/` directory. That churn is
    # deliberately not mixed into behaviour fixes; do it as its own commit
    # (`git mv` + import rewrite) if the team wants snake_case everywhere.
    file_names: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
